repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --config, enforce/python/pyproject.toml]
      - id: ruff-format
        args: [--config, enforce/python/pyproject.toml]
  - repo: local
    hooks:
      - id: oxfmt-check
        name: oxfmt --check
        entry: npx --package=oxfmt@0.74.0 oxfmt --check
        language: system
        types: [text]
        require_serial: true
        files: \.(md|mjs|js|ts|json|ya?ml|toml|html|css)$
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint --max-warnings 0
        entry: npx --package=oxlint@1.89.0 oxlint --max-warnings 0 --no-error-on-unmatched-pattern
        language: system
        files: \.(mjs|js|ts|tsx|jsx)$
        require_serial: true
  - repo: local
    hooks:
      - id: cspell
        name: cspell lint
        entry: npx --package=cspell@10.4.0 cspell lint --no-progress --no-summary --config enforce/cspell.yaml
        language: system
        require_serial: true
        types: [text]
        files: \.md$
