name: maintenance

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version-file: .python-version }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: pip install -r requirements-ci.txt yamllint pre-commit
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - name: Tree and waivers
        run: |
          python3 scripts/check_tree.py
          python3 scripts/check_waivers.py
          python3 scripts/check_version_drift.py
          python3 scripts/check_import_cycles.py
          python3 scripts/check_layer_boundaries.py
          python3 scripts/check_no_any.py
          python3 scripts/check_openapi_breaking.py
          python3 scripts/check_perf_budgets.py
          python3 scripts/check_cardinality.py
          python3 scripts/check_alert_runbooks.py
          python3 scripts/check_action_pins.py
          python3 scripts/check_osv.py
          python3 scripts/check_mutation.py
      - name: YAML hygiene
        run: yamllint -c .yamllint .github/workflows
      - name: Freshness report
        run: bash scripts/check-freshness.sh
      - name: Starter proof
        run: bash scripts/verify-starter.sh
      - name: Feedback digest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/digest_feedback.py || true
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Scheduled maintenance audit failed" \
            --body "The weekly maintenance audit failed. Inspect the workflow run and cut a fix. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
