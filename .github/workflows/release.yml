name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version-file: .python-version }
      - run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py environment -o sbom.json || true
      - run: >
          tar -czf coding-guidelines-${GITHUB_REF_NAME}.tar.gz
          .editorconfig .pre-commit-config.yaml .oxfmtrc.json .oxlintrc.json
          VERSION CHANGELOG.md enforce checks scripts/check_waivers.py
          scripts/check_tree.py scripts/verify-starter.sh
          .github/workflows/quality.yml examples/minimal sbom.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            coding-guidelines-${{ github.ref_name }}.tar.gz
            sbom.json
