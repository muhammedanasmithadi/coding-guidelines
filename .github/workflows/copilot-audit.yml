name: copilot-audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          copilot --version
      - name: Run Copilot audit
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="copilot/audit-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          PROMPT="Audit this repository's coding guidelines. Check tool-version freshness, docs/examples drift, and policy contradictions. Identify concrete improvements versus authoritative sources and community principles. Edit files directly where safe, keep all checks green, and cite sources in docs. Do not remove tests. Prefer small, reversible changes."

          copilot --allow-all-tools --no-ask-user -p "$PROMPT" || true

          if git diff --quiet; then
            echo "No changes proposed by Copilot."
            exit 0
          fi

          git add -A
          git commit -m "chore: automated Copilot audit improvements"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Automated Copilot audit improvements" \
            --body "Automated weekly audit and improvements generated by GitHub Copilot. Review before merge."
