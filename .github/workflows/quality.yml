name: quality
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version-file: .python-version }
      - run: pip install -r requirements-ci.txt
      - run: ruff check . --config enforce/python/pyproject.toml
      - run: ruff format --check . --config enforce/python/pyproject.toml
      - run: lizard -C 15 -L 200 .
      - run: mypy scripts/ --config-file enforce/python/pyproject.toml
      - run: coverage run -m pytest && coverage report --include="scripts/*,tests/*" --fail-under=90
      - run: pip-audit --strict --ignore-vuln CVE-2026-59951
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx oxfmt --check .
      - run: npx oxlint --max-warnings 0 .
      - run: npx tsc --noEmit
      - run: node -e "import('./enforce/typescript/eslint.config.mjs').then(c => { if (!Array.isArray(c.default)) process.exit(1) })"
      - run: npm audit --audit-level=high
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx @stoplight/spectral-cli lint examples/minimal/openapi.yaml -r enforce/.spectral.yaml
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx cspell --no-progress --fail-fast --config enforce/cspell.yaml "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 5 './*.md' './docs/**/*.md' './checks/**/*.md' './examples/**/*.md' './.github/**/*.md'
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
          else
            npx commitlint --from HEAD~1 --to HEAD
          fi
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_changelog.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
          else
            python3 scripts/check_changelog.py --base HEAD~1 --head HEAD
          fi
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr view ${{ github.event.pull_request.number }} --json body --jq .body > pr-body.md
            python3 scripts/check_decision_note.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --body-file pr-body.md
            rm pr-body.md
          else
            echo "not a pull request; skipping decision-note check"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version-file: .python-version }
      - run: pip install pyyaml
      - run: python3 scripts/check_waivers.py
      - run: python3 scripts/check_tree.py
      - run: python3 scripts/check_version_drift.py
      - run: python3 scripts/check_import_cycles.py
      - run: python3 scripts/check_layer_boundaries.py
      - run: python3 scripts/check_no_any.py
      - run: python3 scripts/check_openapi_breaking.py
      - run: python3 scripts/check_perf_budgets.py
      - run: python3 scripts/check_cardinality.py
      - run: python3 scripts/check_alert_runbooks.py
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version-file: .python-version }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version-file: .nvmrc }
      - run: pip install pre-commit
      - run: bash scripts/verify-starter.sh
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version-file: .python-version }
      - run: pip install 'semgrep==1.181.0'
      - run: semgrep scan --config p/default --severity ERROR --error --jobs 1 --max-memory 1000 scripts/
