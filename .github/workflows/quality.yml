name: quality
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
      - uses: pre-commit/action@v3.0.1
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - run: pip install -r requirements-ci.txt
      - run: ruff check . --config enforce/python/pyproject.toml
      - run: ruff format --check . --config enforce/python/pyproject.toml
      - run: lizard -C 15 -L 200 .
      - run: mypy scripts/ --config-file enforce/python/pyproject.toml
      - run: coverage run -m pytest && coverage report --include="scripts/*,tests/*" --fail-under=80
      - run: pip-audit --strict
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx oxfmt --check .
      - run: npx oxlint --max-warnings 0 .
      - run: npx tsc --noEmit
      - run: node -e "import('./enforce/typescript/eslint.config.mjs').then(c => { if (!Array.isArray(c.default)) process.exit(1) })"
      - run: npm audit --audit-level=high
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx @stoplight/spectral-cli lint examples/minimal/openapi.yaml -r enforce/.spectral.yaml
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx cspell --no-progress --fail-fast --config enforce/cspell.yaml "**/*.md"
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress './*.md' './docs/**/*.md' './checks/**/*.md' './examples/**/*.md' './.github/**/*.md'
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
          else
            npx commitlint --from HEAD~1 --to HEAD
          fi
      - uses: gitleaks/gitleaks-action@v3
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - run: pip install pyyaml
      - run: python3 scripts/check_waivers.py
      - run: python3 scripts/check_tree.py
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: pip install pre-commit
      - run: bash scripts/verify-starter.sh
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: pip install 'semgrep==1.181.0'
      - run: semgrep scan --config p/default --severity ERROR --error --jobs 1 --max-memory 1000 scripts/
