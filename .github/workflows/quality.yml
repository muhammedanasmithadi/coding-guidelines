name: quality
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: editorconfig-checker/action-editorconfig-checker@main
      - uses: pre-commit/action@v3.0.1
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version-file: .python-version }
      - run: pip install -r requirements-ci.txt
      - run: ruff check . --config enforce/python/pyproject.toml
      - run: black --check scripts/ tests/ --config enforce/python/pyproject.toml
      - run: lizard -C 15 -L 200 .
      - run: radon cc -s -n B scripts/ tests/
      - run: mypy scripts/ --config-file enforce/python/pyproject.toml
      - run: coverage run -m pytest && coverage report --include="scripts/*,tests/*" --fail-under=80
      - run: pip-audit --strict
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx prettier --check .
      - run: npx eslint . --max-warnings=0
      - run: npx tsc --noEmit
      - run: node -e "import('./enforce/typescript/eslint.config.mjs').then(c => { if (!Array.isArray(c.default)) process.exit(1) })"
      - run: npm audit --audit-level=high
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx @stoplight/spectral-cli lint examples/minimal/openapi.yaml -r enforce/.spectral.yaml
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts || npm install --no-audit --no-fund
      - run: npx cspell --no-progress --fail-fast --config enforce/cspell.yaml "**/*.md"
      - run: lychee --no-progress "**/*.md"
      - run: npx commitlint --from HEAD~1 --to HEAD
      - uses: gitleaks/gitleaks-action@v2
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version-file: .python-version }
      - run: pip install pyyaml
      - run: python3 scripts/check_waivers.py
      - run: python3 scripts/check_tree.py
