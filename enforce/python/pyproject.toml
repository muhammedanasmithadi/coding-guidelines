[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "B",
  "BLE",
  "UP",
  "TID",
  "SIM",
  "TD",
  "C901",
  "PLR0912",
  "PLR0915",
  "PLR2004",
  "S110",
  "S112",
  "S113",
  "S311",
  "S501",
  "S502",
  "S602",
  "S608",
  "ERA001",
  "PT018",
  "PT",
  "DTZ",
  "PTH",
  "TRY",
  "LOG",
  "RET",
  "ARG",
  "TC",
  "ASYNC",
]
ignore = ["UP031"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.coverage.run]
branch = true
source = ["src", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
