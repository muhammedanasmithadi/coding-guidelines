[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID", "SIM"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
branch = true
source = ["src", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.lizard]
CCN = 15
length = 200
