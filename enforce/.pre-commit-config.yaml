repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.1.2
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff-check
        args: [--fix, --config, enforce/python/pyproject.toml]
      - id: ruff-format
        args: [--config, enforce/python/pyproject.toml]
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier --check (check semantics, no --write)
        entry: npx prettier --check --ignore-unknown
        language: system
        types: [text]
  - repo: local
    hooks:
      - id: cspell
        name: cspell lint
        entry: npx cspell lint --no-progress --no-summary --config enforce/cspell.yaml
        language: system
        types: [text]
  - repo: https://github.com/lycheeverse/lychee
    rev: v0.15.1
    hooks:
      - id: lychee
        args: ['--no-progress', '**/*.md']
