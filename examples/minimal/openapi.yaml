openapi: 3.1.0
info:
  title: Minimal service contract
  version: 1.0.0
  description: Minimal adoptable contract. Paginate with cursor, create with idempotency key.
  contact:
    name: Platform
    email: platform@example.com
servers:
  - url: https://api.example.com/v1
tags:
  - name: orders
    description: Order resources
paths:
  /orders:
    get:
      operationId: listOrders
      description: List orders with keyset cursor.
      tags:
        - orders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema:
                type: object
                required:
                  - value
                properties:
                  value:
                    type: array
                    items:
                      type: object
                  nextLink:
                    type: string
    post:
      operationId: createOrder
      description: Create one order. Retry-safe via idempotency key.
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idempotencyKey
              properties:
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
